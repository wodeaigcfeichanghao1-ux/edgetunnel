name: Sync from jhk5263/edgetunnel

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup local config files
        run: |
          if [ -f wrangler.toml ]; then
            cp wrangler.toml /tmp/wrangler.toml.backup
          fi

          if [ -d .github/workflows ]; then
            mkdir -p /tmp/local-workflows
            cp -a .github/workflows/. /tmp/local-workflows/
          fi

      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/jhk5263/edgetunnel.git
          git fetch upstream

          DEFAULT_BRANCH=$(git remote show upstream | grep 'HEAD branch' | cut -d' ' -f5)
          echo "Default branch: $DEFAULT_BRANCH"

          git reset --hard upstream/$DEFAULT_BRANCH

          # 恢复自己的 wrangler.toml
          if [ -f /tmp/wrangler.toml.backup ]; then
            cp /tmp/wrangler.toml.backup wrangler.toml
            git add wrangler.toml
          fi

          # 恢复自己的 GitHub Actions
          if [ -d /tmp/local-workflows ]; then
            mkdir -p .github/workflows
            cp -a /tmp/local-workflows/. .github/workflows/
            git add .github/workflows
          fi

          # 如果有变化才提交
          if ! git diff --cached --quiet; then
            git commit -m "Restore personal configuration" --no-verify
          fi

          git push origin $DEFAULT_BRANCH --force
